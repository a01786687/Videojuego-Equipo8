    <!-- chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- stats page js -->

    <script>
        
        async function renderRunsChart() {

            // fetch data from the backend
            const res = await fetch('http://localhost:8080/stats/runsPerUser');
            const data = await res.json();

            console.log('Data from server:', data);

            // transform data for chart.js since it can´t use json format directly, we extract with .map()
            // .map() -> array method that transforms each element, it goes through each object, grabs the username field and puts it in a new array
            // parseInt() converts strings to a real number, the result of the endpoint we're using is an string
            const labels = data.map(row => row.username);
            const values = data.map(row => parseInt(row.totalRuns));

            console.log('Labels:', labels);
            console.log('Values:', values);

            // canvas ref to draw
            const canvas = document.getElementById('runsChart');
            const ctx = canvas.getContext('2d');

            // chart creation
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Runs',
                        data: values,
                        backgroundColor: '#8cff9b',
                        borderColor: '#42bc7f',
                        borderWidth: 2,
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true, // makes the chart resizable when the window resizes
                    mantainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false, // to hide the legend
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1,
                                color: '#c8c4d8',
                                font: {
                                    family: 'Pixelify Sans',
                                    size: 14
                                }
                            },
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            ticks: {
                                color: '#c8c4d8',
                                font: {
                                    family: 'Pixelify Sans',
                                    size: 14
                                }
                            },
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
                
        }


        async function renderMosquitoesChart() {

            // fetch data from the backend
            const res = await fetch('http://localhost:8080/stats/mosquitoesPerUser');
            const data = await res.json();

            console.log('Data from server:', data);

            // transform data for chart.js since it can´t use json format directly, we extract with .map()
            // .map() -> array method that transforms each element, it goes through each object, grabs the username field and puts it in a new array
            // parseInt() converts strings to a real number, the result of the endpoint we're using is an string
            const labels = data.map(row => row.username);
            const values = data.map(row => parseInt(row.totalMosquitoes));

            console.log('Labels:', labels);
            console.log('Values:', values);

            // canvas ref to draw
            const canvas = document.getElementById('mosquitoesChart');
            const ctx = canvas.getContext('2d');

            // chart creation
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Lifetime Mosquitoes Collected',
                        data: values,
                        backgroundColor: '#8cff9b',
                        borderColor: '#42bc7f',
                        borderWidth: 2,
                    }]
                },
                options: { // modifies the chart's look and behaviour
                    indexAxis: 'y', // horizontal bars
                    responsive: true, // makes the chart resizable when the window resizes
                    mantainAspectRatio: true, //keeps the chart's width to height ratio consistent when resizing (true is locked, false can squeeze in out etc)
                    plugins: { 
                        legend: {
                            display: false, // to hide the legend
                        }
                    },

                    // scales (Axes)
                    scales: {
                        x: { // numbers axis
                            beginAtZero: true, // start axis at 0
                            ticks: {
                                stepSize: 1, // how far apart numbers on the axis should be, this case is every whole number
                                color: '#c8c4d8', //
                                font: {
                                    family: 'Pixelify Sans',
                                    size: 14
                                }
                            },
                            grid: {
                                display: false // hide vertical grid lines
                            }
                        },
                        y: { // categories axis (usernames)
                            ticks: {
                                color: '#c8c4d8',
                                font: {
                                    family: 'Pixelify Sans',
                                    size: 14
                                }
                            },
                            grid: {
                                display: false // hide horizontal grid lines
                            }
                        }
                    }
                }
            });
                
        }
